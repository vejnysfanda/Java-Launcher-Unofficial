name: Build Java Launcher IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore external dependencies
        run: |
          set -euo pipefail
          # The imported source ZIP omitted Git submodule commit pointers.
          # Recover the exact gitlinks from the original Amethyst source commit.
          upstream=54d20f9a7b22c8cadc026cbad8eb1a386a1e6efe
          git fetch --no-tags --depth=1 https://github.com/Taylen27/Amethyst-iOS.git "$upstream"
          git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | while read -r key path; do
            url=$(git config -f .gitmodules --get "${key%.path}.url")
            entry=$(git ls-tree "$upstream" -- "$path")
            read -r mode type sha ignored <<< "$entry"
            test "$mode" = 160000
            test "$type" = commit
            echo "Restoring $path at $sha"
            git init "$path"
            git -C "$path" fetch --no-tags --depth=1 "$url" "$sha"
            git -C "$path" checkout --detach FETCH_HEAD
            git -C "$path" remote get-url origin >/dev/null 2>&1 || git -C "$path" remote add origin "$url"
            git -C "$path" submodule update --init --recursive
          done
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install dependencies
        run: brew install make ldid temurin@8
      - name: Build IPA
        run: gmake -j$(sysctl -n hw.ncpu) package PLATFORM=2
      - uses: actions/upload-artifact@v4
        with:
          name: Java-Launcher-Unofficial-1.0.2
          path: artifacts/com.dualboot-gaming.mcjavalauncher-*-ios.ipa
          if-no-files-found: error
